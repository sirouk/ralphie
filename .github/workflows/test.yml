name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Bash version
        run: bash --version | head -1

      - name: Syntax
        run: bash -n ralphie.sh && bash -n test.sh

      - name: Syntax under bash 3.2 (macOS system bash)
        if: runner.os == 'macOS'
        run: /bin/bash -n ralphie.sh && /bin/bash -n test.sh

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi
          shellcheck -S error -e SC1090,SC1091,SC2317 ralphie.sh
        if: runner.os == 'Linux'

      - name: Test suite
        run: ./test.sh

      - name: Test suite under bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash ./test.sh
