name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Bash version
        run: /bin/bash --version | head -1

      - name: Syntax
        run: /bin/bash -n ralphie.sh && /bin/bash -n test.sh

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi
          shellcheck -S error -e SC1090,SC1091,SC2317 ralphie.sh
        if: runner.os == 'Linux'

      - name: Test suite (system bash, including child scripts)
        run: PATH="/bin:/usr/bin:$PATH" /bin/bash ./test.sh

      - name: Install (curl | bash) round trip
        run: |
          cd /tmp && rm -rf install-test && mkdir install-test && cd install-test
          curl -fsSLo ralphie.sh "file://$(pwd)/../../ralphie.sh" 2>/dev/null || cp "$GITHUB_WORKSPACE/ralphie.sh" ralphie.sh
          /bin/bash ralphie.sh version
          /bin/bash -n ralphie.sh
        if: runner.os == 'Linux'
