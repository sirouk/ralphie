name: Durability CI

on:
  push:
    paths:
      - 'ralphie.sh'
      - 'test.sh'
      - 'tests/**'
      - 'engines/**'
      - '.github/workflows/durability-ci.yml'
  pull_request:
    paths:
      - 'ralphie.sh'
      - 'test.sh'
      - 'tests/**'
      - 'engines/**'
      - '.github/workflows/durability-ci.yml'
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: 'Run a direct provider API smoke check (uses API secrets and can incur cost)'
        required: true
        type: boolean
        default: false
      live_engine:
        description: 'Provider API path for live smoke'
        required: true
        type: choice
        options:
          - codex
          - claude
        default: codex

permissions:
  contents: read

jobs:
  durability:
    name: Offline Durability Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run offline pre-ship suite
        shell: bash
        run: |
          chmod +x test.sh tests/durability/*.sh engines/setup-agent-subrepos.sh
          ./test.sh --skip-live

  live_smoke:
    name: Live Provider API Smoke
    needs: durability
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live smoke
        shell: bash
        env:
          LIVE_SMOKE_ENGINE: ${{ inputs.live_engine }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LIVE_SMOKE_CODEX_MODEL: ${{ vars.LIVE_SMOKE_CODEX_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          LIVE_SMOKE_CLAUDE_MODEL: ${{ vars.LIVE_SMOKE_CLAUDE_MODEL }}
        run: |
          chmod +x tests/durability/run-live-smoke.sh
          tests/durability/run-live-smoke.sh "$LIVE_SMOKE_ENGINE"
